# Version: 0.3
# Host: kubernetes.marsel.is
# Roll, on 3jane:
# /usr/bin/time /usr/bin/virt-install --name kubernetes.marsel.is --memory 4096 --vcpus 2 --disk pool=default,size=20,format=qcow2 --location /var/lib/libvirt/iso/debian-13.4.0-amd64-netinst.iso --os-variant debian13 --boot uefi --network bridge=br-eno2,model=e1000 --graphics none --console pty,target_type=serial --initrd-inject /home/gmarselis/src/pret-a-booter/kubernetes.marsel.is.preseed.cfg --extra-args="console=ttyS0,115200n8 auto=true priority=critical preseed/file=/kubernetes.marsel.is.preseed.cfg systemd.ssh_auto=no" --wait=-1
# Locale
d-i debian-installer/locale string en_US.UTF-8
d-i keyboard-configuration/xkb-keymap select us
# Network
d-i netcfg/choose_interface select auto
d-i netcfg/disable_autoconfig boolean true
d-i netcfg/get_ipaddress string 10.0.0.11
d-i netcfg/get_netmask string 255.255.255.0
d-i netcfg/get_gateway string 10.0.0.138
d-i netcfg/get_nameservers string 1.1.1.1
d-i netcfg/confirm_static boolean true
d-i netcfg/get_hostname string kubernetes
d-i netcfg/get_domain string marsel.is
# Mirror
d-i mirror/country string manual
d-i mirror/http/hostname string deb.debian.org
d-i mirror/http/directory string /debian
d-i mirror/http/proxy string
# Clock
d-i clock-setup/utc boolean true
d-i time/zone string Europe/Oslo
d-i clock-setup/ntp boolean true
# Partitioning
d-i partman-basicfilesystems/choose_label select gpt
d-i partman-basicfilesystems/default_label string gpt
d-i partman-auto/disk string /dev/vda
d-i partman-auto/method string regular
d-i partman-auto/expert_recipe string \
    custom ::                          \
        512 512 512 fat32              \
            $primary{ }               \
            method{ efi }             \
            format{ }                 \
        .                              \
        1024 1024 1024 ext4            \
            $primary{ }               \
            method{ format }          \
            format{ }                 \
            use_filesystem{ }         \
            filesystem{ ext4 }        \
            mountpoint{ /boot }       \
        .                              \
        10000 20000 -1 btrfs           \
            method{ format }          \
            format{ }                 \
            use_filesystem{ }         \
            filesystem{ btrfs }       \
            mountpoint{ / }           \
        .
d-i partman-partitioning/confirm_write_new_label boolean true
d-i partman/choose_partition select finish
d-i partman/confirm boolean true
d-i partman/confirm_nooverwrite boolean true
d-i partman-efi/non_efi_system boolean false
# Root account disabled
d-i passwd/root-login boolean false
# User
d-i passwd/user-fullname string gmarselis
d-i passwd/username string gmarselis
d-i passwd/user-password-crypted password !
d-i passwd/user-default-groups string sudo
# Packages
tasksel tasksel/first multiselect standard
d-i pkgsel/include string vim openssh-server xauth ca-certificates curl gnupg shim-signed grub-efi-amd64-signed ncdu parted nmap apt-file etckeeper
d-i pkgsel/upgrade select full-upgrade
# Bootloader
d-i grub-installer/only_debian boolean true
d-i grub-installer/bootdev string /dev/vda
d-i grub-installer/with_other_os boolean false
# Finish
d-i finish-install/reboot_in_progress note
# Post-install
d-i preseed/late_command string \
    in-target bash -c 'echo kubernetes.marsel.is > /etc/hostname'; \
    in-target mkdir -p /home/gmarselis/.ssh; \
    in-target bash -c 'echo "ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIL5G39vHZAQFo6BuFfJtIFUR/4DyQtf9KIIy4jJlcBQt gmarselis@molly.vetinst.no" > /home/gmarselis/.ssh/authorized_keys'; \
    in-target chown -R gmarselis:gmarselis /home/gmarselis/.ssh; \
    in-target chmod 700 /home/gmarselis/.ssh; \
    in-target chmod 600 /home/gmarselis/.ssh/authorized_keys; \
    in-target bash -c 'echo "gmarselis ALL=(ALL) NOPASSWD: ALL" > /etc/sudoers.d/gmarselis'; \
    in-target chmod 440 /etc/sudoers.d/gmarselis; \
    in-target sed -i 's/GRUB_CMDLINE_LINUX=""/GRUB_CMDLINE_LINUX="console=ttyS0,115200n8 systemd.ssh_auto=no"/' /etc/default/grub; \
    in-target update-grub; \
    in-target apt-get purge -y qemu-guest-agent; \
    in-target ln -sf /dev/null /etc/systemd/system-generators/systemd-ssh-generator; \
    in-target install -m 0755 -d /etc/apt/keyrings; \
    in-target curl -fsSL https://download.docker.com/linux/debian/gpg -o /etc/apt/keyrings/docker.asc; \
    in-target chmod a+r /etc/apt/keyrings/docker.asc; \
    in-target bash -c 'echo "deb [arch=amd64 signed-by=/etc/apt/keyrings/docker.asc] https://download.docker.com/linux/debian trixie stable" > /etc/apt/sources.list.d/docker.list'; \
    in-target apt-get update; \
    in-target apt-get install -y containerd.io; \
    in-target curl -fsSL https://pkgs.k8s.io/core:/stable:/v1.34/deb/Release.key -o /etc/apt/keyrings/kubernetes.asc; \
    in-target chmod a+r /etc/apt/keyrings/kubernetes.asc; \
    in-target bash -c 'echo "deb [signed-by=/etc/apt/keyrings/kubernetes.asc] https://pkgs.k8s.io/core:/stable:/v1.34/deb/ /" > /etc/apt/sources.list.d/kubernetes.list'; \
    in-target apt-get update; \
    in-target apt-get install -y kubelet kubeadm kubectl; \
    in-target apt-mark hold kubelet kubeadm kubectl; \
    in-target bash -c 'printf "overlay\nbr_netfilter\n" > /etc/modules-load.d/k8s.conf'; \
    in-target bash -c 'printf "net.bridge.bridge-nf-call-iptables = 1\nnet.bridge.bridge-nf-call-ip6tables = 1\nnet.ipv4.ip_forward = 1\n" > /etc/sysctl.d/k8s.conf'; \
    in-target bash -c 'containerd config default > /etc/containerd/config.toml'; \
    in-target sed -i "s/SystemdCgroup = false/SystemdCgroup = true/" /etc/containerd/config.toml; \
    in-target apt-file update; \
    in-target etckeeper init; \
    in-target bash -c 'printf "[Unit]\nDescription=etckeeper initial commit\nAfter=network.target\nConditionPathExists=!/etc/.git/refs/heads/main\n\n[Service]\nType=oneshot\nExecStart=/usr/bin/etckeeper commit \"Initial post-install commit\"\nRemainAfterExit=yes\n\n[Install]\nWantedBy=multi-user.target\n" > /etc/systemd/system/etckeeper-initial-commit.service'; \
    in-target systemctl enable etckeeper-initial-commit; \
    in-target update-alternatives --set editor /usr/bin/vim.basic;
